name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify layout and version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' ForeverGuides ForeverGuides_GildenManager ForeverGuides_MapData ForeverGuides_Professions ForeverGuides_Recipes | sort)
          actual=$(find . -mindepth 1 -maxdepth 1 -type d -not -name .git -not -name .github -printf '%f\n' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "Unexpected top-level folders:"
            echo "$actual"
            exit 1
          fi
          toc_version=$(sed -n 's/^## Version:[[:space:]]*//p' ForeverGuides/ForeverGuides.toc | tr -d '\r')
          if [ "v${toc_version}" != "$TAG" ]; then
            echo "Tag ${TAG} does not match TOC version ${toc_version}"
            exit 1
          fi

      - name: Build zip and create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          ZIP="ForeverGuides-${VERSION}.zip"
          zip -r -X -q "$ZIP" ForeverGuides ForeverGuides_GildenManager ForeverGuides_MapData ForeverGuides_Professions ForeverGuides_Recipes
          TITLE="Forever Guides ${VERSION}"
          if [ "${VERSION%%.*}" = "0" ]; then
            TITLE="${TITLE} (Beta)"
          fi
          gh release create "$TAG" "$ZIP" --title "$TITLE" --notes-from-tag --verify-tag
